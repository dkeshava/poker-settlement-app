# ===================================================================
# Production Profile (prod)
# ===================================================================

# Managed PostgreSQL (Neon / Supabase / Render) credentials from environment
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# HikariCP Connection Pool (optimized for cloud serverless Postgres)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# Flyway Migrations & JPA Schema Validation
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Security & Secrets
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://*.vercel.app}

# Production Logging & Error Handling
server.error.include-stacktrace=never
server.error.include-message=always
logging.level.org.springframework.web=INFO
logging.level.com.dk.pokersettlement=INFO
